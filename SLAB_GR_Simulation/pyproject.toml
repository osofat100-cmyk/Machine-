# Packaging of the SLAB_GR_Simulation physics engine (src layout, package "slab").
#
#   pip install -e .            # editable install; provides the console command `slab-sim`
#   pip install -e ".[test]"    # + pytest
#   pip install -e ".[tools]"   # + sympy (symbolic re-derivation: python tools/derive_ef_curvature.py)
#
# `slab-sim` runs the same pipeline as `python run_simulation.py` (see src/slab/cli.py); the stand-alone
# script keeps working without any installation.  Keep requirements.txt in sync with the dependency
# lists below (tests/test_packaging.py checks it).
[build-system]
requires = ["setuptools>=64"]          # >= 64: PEP 660 editable installs
build-backend = "setuptools.build_meta"

[project]
name = "slab-gr-simulation"
dynamic = ["version"]
description = "Validated classical-GR simulation of radial infall into a 1e18 solar-mass Schwarzschild black hole, down to the Planck-curvature radius"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SLAB_GR_Simulation contributors" }]
keywords = ["general relativity", "Schwarzschild", "black hole", "geodesic", "Eddington-Finkelstein"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.9",
    "mpmath>=1.3",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]
tools = [
    "sympy>=1.12",
]

[project.scripts]
slab-sim = "slab.cli:main"

[tool.setuptools.dynamic]
version = { attr = "slab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["slab", "slab.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
